name: Build Snake Master Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Snake Master APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter and Dart Versions
        run: |
          flutter --version
          dart --version

      - name: Verify Android Icon File
        run: |
          test -s assets/icon/app_icon.png || {
            echo "ERROR: assets/icon/app_icon.png is missing or empty."
            exit 1
          }
          file assets/icon/app_icon.png

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Generate Android Launcher Icons
        run: flutter pub run flutter_launcher_icons:main

      - name: Verify Generated Android Icons
        run: |
          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          echo "Launcher icon files generated successfully."

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Snake Master APK
        uses: actions/upload-artifact@v4
        with:
          name: Snake-Master-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
          
