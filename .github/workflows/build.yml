
      - name: Set Start.io plugin Compile SDK to 36
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          files = list(
              Path.home().glob(
                  ".pub-cache/hosted/pub.dev/startapp_sdk-*/android/build.gradle"
              )
          )

          if not files:
              raise SystemExit("Start.io Android Gradle file not found")

          fixed = False

          for gradle_file in files:
              content = gradle_file.read_text(encoding="utf-8")

              updated, count = re.subn(
                  r'(?m)^(\s*)compileSdkVersion\s+\d+\s*$',
                  r'\g<1>compileSdkVersion 36',
                  content
              )

              if count:
                  gradle_file.write_text(updated, encoding="utf-8")
                  print("Updated:", gradle_file)
                  fixed = True

          if not fixed:
              raise SystemExit(
                  "Could not find the hardcoded Start.io compileSdkVersion"
              )

          print("Start.io plugin compile SDK is now 36")
          PY
          
