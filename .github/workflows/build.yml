
name: Build Snake Master APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          flutter create \
            --platforms=android \
            --org com.shahabmillizai \
            --project-name snakemaster .

      - name: Set Android Compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts")
          ]

          found = False

          for file in files:
              if not file.exists():
                  continue

              content = file.read_text(encoding="utf-8")

              content = re.sub(
                  r'compileSdkVersion\s+flutter\.compileSdkVersion',
                  'compileSdkVersion 36',
                  content
              )

              content = re.sub(
                  r'compileSdk\s*=\s*flutter\.compileSdkVersion',
                  'compileSdk = 36',
                  content
              )

              file.write_text(content, encoding="utf-8")
              found = True
              print("Checked:", file)

          if not found:
              raise SystemExit("Android Gradle file not found")
          PY

      - name: Configure Start.io and Internet Permissions
        env:
          STARTIO_APP_ID: ${{ secrets.STARTIO_APP_ID }}
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          app_id = os.environ.get("STARTIO_APP_ID", "").strip()

          if not app_id:
              raise SystemExit("ERROR: STARTIO_APP_ID secret is missing")

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise SystemExit("Android manifest not found")

          ET.register_namespace(
              "android",
              "http://schemas.android.com/apk/res/android"
          )

          android = "{http://schemas.android.com/apk/res/android}"

          tree = ET.parse(manifest)
          root = tree.getroot()

          # Add required network permissions.
          required_permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.ACCESS_WIFI_STATE"
          ]

          existing_permissions = {
              item.get(android + "name")
              for item in root.findall("uses-permission")
          }

          for permission in required_permissions:
              if permission not in existing_permissions:
                  item = ET.Element("uses-permission")
                  item.set(android + "name", permission)
                  root.insert(0, item)

          # Find Android application element.
          application = root.find("application")

          if application is None:
              raise SystemExit("Application element not found")

          # Configure Start.io App ID.
          key = "com.startapp.sdk.APPLICATION_ID"
          meta = None

          for item in application.findall("meta-data"):
              if item.get(android + "name") == key:
                  meta = item
                  break

          if meta is None:
              meta = ET.SubElement(application, "meta-data")
              meta.set(android + "name", key)

          meta.set(android + "value", app_id)

          tree.write(
              manifest,
              encoding="utf-8",
              xml_declaration=True
          )

          # Verify the final generated manifest.
          check_tree = ET.parse(manifest)
          check_root = check_tree.getroot()

          final_permissions = {
              item.get(android + "name")
              for item in check_root.findall("uses-permission")
          }

          for permission in required_permissions:
              if permission not in final_permissions:
                  raise SystemExit(
                      "Missing permission: " + permission
                  )

          check_application = check_root.find("application")

          found_app_id = False

          for item in check_application.findall("meta-data"):
              if item.get(android + "name") == key:
                  if item.get(android + "value") == app_id:
                      found_app_id = True

          if not found_app_id:
              raise SystemExit("Start.io App ID verification failed")

          print("SUCCESS: Start.io App ID configured")
          print("SUCCESS: Internet permission configured")
          print("SUCCESS: Network state permission configured")
          print("SUCCESS: WiFi state permission configured")
          PY

            - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos
      - name: Set Start.io plugin Compile SDK to 36
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          files = list(
              Path.home().glob(
                  ".pub-cache/hosted/pub.dev/startapp_sdk-*/android/build.gradle"
              )
          )

          if not files:
              raise SystemExit("Start.io plugin Gradle file not found")

          fixed = False

          for file in files:
              content = file.read_text(encoding="utf-8")

              updated, count = re.subn(
                  r'(?m)^(\s*)compileSdkVersion\s+\d+\s*$',
                  r'\g<1>compileSdkVersion 36',
                  content
              )

              if count:
                  file.write_text(updated, encoding="utf-8")
                  print("Updated:", file)
                  fixed = True

          if not fixed:
              raise SystemExit(
                  "Could not update Start.io plugin compileSdkVersion"
              )

          print("SUCCESS: Start.io plugin Compile SDK set to 36")
          PY

      - name: Remove generated default test
        run: rm -f test/widget_test.dart

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK exists
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Snake-Master-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
