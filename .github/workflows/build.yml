
name: Build Snake Master Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Snake Master APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter Version
        run: flutter --version

      - name: Verify Custom Icon
        run: |
          if [ ! -f assets/icon/app_icon.png ]; then
            echo "ERROR: Custom app icon not found!"
            exit 1
          fi

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Generate Custom Android Launcher Icon
        run: dart run flutter_launcher_icons

      - name: Clean Previous Build
        run: flutter clean

      - name: Get Dependencies Again
        run: flutter pub get

      - name: Generate Launcher Icon Again
        run: dart run flutter_launcher_icons

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Snake Master APK
        uses: actions/upload-artifact@v4
        with:
          name: Snake-Master-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Summary
        if: success()
        run: |
          echo "Snake Master APK built successfully!"
          echo "Custom launcher icon generation completed."
