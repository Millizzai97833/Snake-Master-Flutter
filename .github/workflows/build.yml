name: Build Snake Master APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: flutter create --platforms=android --org com.shahabmillizai --project-name snakemaster .

      - name: Set Android Compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts")
          ]

          found = False

          for file in files:
              if not file.exists():
                  continue

              content = file.read_text(encoding="utf-8")

              content = re.sub(
                  r'compileSdkVersion\s+flutter\.compileSdkVersion',
                  'compileSdkVersion 36',
                  content
              )

              content = re.sub(
                  r'compileSdk\s*=\s*flutter\.compileSdkVersion',
                  'compileSdk = 36',
                  content
              )

              file.write_text(content, encoding="utf-8")
              found = True
              print("Checked:", file)

          if not found:
              raise SystemExit("Android Gradle file not found")
          PY

      - name: Configure Start.io App ID
        env:
          STARTIO_APP_ID: ${{ secrets.STARTIO_APP_ID }}
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          app_id = os.environ.get("STARTIO_APP_ID", "").strip()

          if not app_id:
              raise SystemExit("STARTIO_APP_ID secret is missing")

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          ET.register_namespace(
              "android",
              "http://schemas.android.com/apk/res/android"
          )

          android = "{http://schemas.android.com/apk/res/android}"

          tree = ET.parse(manifest)
          root = tree.getroot()
          application = root.find("application")

          if application is None:
              raise SystemExit("Application element not found")

          key = "com.startapp.sdk.APPLICATION_ID"
          meta = None

          for item in application.findall("meta-data"):
              if item.get(android + "name") == key:
                  meta = item
                  break

          if meta is None:
              meta = ET.SubElement(application, "meta-data")
              meta.set(android + "name", key)

          meta.set(android + "value", app_id)

          tree.write(
              manifest,
              encoding="utf-8",
              xml_declaration=True
          )

          print("Start.io App ID configured")
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Set Start.io plugin Compile SDK to 36
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          files = list(
              Path.home().glob(
                  ".pub-cache/hosted/pub.dev/startapp_sdk-*/android/build.gradle"
              )
          )

          if not files:
              raise SystemExit("Start.io plugin Gradle file not found")

          fixed = False

          for file in files:
              content = file.read_text(encoding="utf-8")

              updated, count = re.subn(
                  r'(?m)^(\s*)compileSdkVersion\s+\d+\s*$',
                  r'\g<1>compileSdkVersion 36',
                  content
              )

              if count:
                  file.write_text(updated, encoding="utf-8")
                  print("Updated:", file)
                  fixed = True

          if not fixed:
              raise SystemExit(
                  "Could not update Start.io plugin compileSdkVersion"
              )

          print("SUCCESS: Start.io plugin Compile SDK set to 36")
          PY

      - name: Remove generated default test
        run: rm -f test/widget_test.dart

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Snake-Master-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
