name: Build Snake Master Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Snake Master APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Generate Missing Android Project
        run: |
          flutter create --platforms=android --org com.shahabmillizai --project-name snakemaster .
          test -f android/app/src/main/AndroidManifest.xml
          grep -Rqs 'applicationId.*com.shahabmillizai.snakemaster' android/app

      - name: Verify Custom Icon
        run: |
          test -s assets/icon/app_icon.png
          file assets/icon/app_icon.png

      - name: Get Dependencies
        run: flutter pub get

      - name: Generate Custom Launcher Icon
        run: dart run flutter_launcher_icons

      - name: Verify Launcher Icons
        run: |
          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xhdpi/ic_launcher.png

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Snake-Master-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
          
